apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-project
  template:
    metadata:
      labels:
        app: mongodb-project
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
      - name: frontend
        image: philippaul/node-mongo-db:02

---

apiVersion: v1
kind: Service
metadata:
  name: service-modedb
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 3000
  selector:
    app: mongodb-project
  type: LoadBalancer
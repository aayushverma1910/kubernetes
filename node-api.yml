apiVersion: apps/v1
kind: Deployment
metadata:
  name: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-react
  template:
    metadata:
      labels:
        app: node-react
    spec:
      containers:
      - name: frontend
        image: philippaul/node-mongo-db:04
        env:
          - name: MONGO_HOST
            valueFrom:
              configMapKeyRef:
                name: mongo-config
                key: MONGO_HOST
          - name: MONGO_PORT
            valueFrom:
              configMapKeyRef:
                name: mongo-config
                key: MONGO_PORT
          
---

apiVersion: v1
kind: Service
metadata:
  name: service-node-react
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 3000
  selector:
    app: node-react